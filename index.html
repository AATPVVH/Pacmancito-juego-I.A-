 g.fillStyle='#e52521';g.fillRect(-12,16,24,6);g.fillStyle='#2038ec';g.fillRect(-9,20,18,10);g.fillStyle='#fd0';g.fillRect(-6,22,3,3);g.fillRect(4,22,3,3);g.fillStyle='#5a2a00';g.fillRect(-12,30+s/3,10,4);g.fillRect(2,33-s/3,10,4);g.restore()}

 if(e.dead){const c=e.k=='g'?'#8a4b20':e.k=='k'?'#1fa22e':e.k=='p'?e.col:'#f4f4ff';X.fillStyle=c;X.beginPath();X.ellipse(x+14,y+25,14,5,0,0,Math.PI*2);X.fill();X.fillStyle='#fff';X.fillRect(x+6,y+21,6,3);X.fillRect(x+16,y+21,6,3);X.fillStyle='#111';X.fillRect(x+8,y+22,2,2);X.fillRect(x+18,y+22,2,2);return}

 else if(e.k=='g'){bodyG(e,'#f2c99a');dc(x+14,y+13,14,'#8a4b20');X.fillStyle='#8a4b20';X.fillRect(x,y+13,28,3);X.fillStyle='#fff';X.fillRect(x+4,y+10,8,6);X.fillRect(x+16,y+10,8,6);dc(x+9+d*2,y+13,2,'#000');dc(x+19+d*2,y+13,2,'#000');X.fillStyle='#000';X.fillRect(x+3,y+6,9,2);X.fillRect(x+16,y+6,9,2)}
 else if(e.k=='k'){bodyG(e,'#fff3c0');X.fillStyle='#1fa22e';X.beginPath();X.ellipse(x+14-d*8,y+14,9,10,0,0,7);X.fill();dc(x+14+d*5,y+11,4,'#fff');dc(x+14+d*7,y+11,2,'#000');X.fillStyle='#e8a000';X.fillRect(x+14+d*5,y+19,7,3)}

// ---- world helpers
const rng=s=>()=>(s=(s*1664525+1013904223)>>>0)/4294967296;

function gen(i){
 lvl=i;castle=i%4==3?1:0;world=i>>2;mw=castle?120+world*6:150+world*8+(i%4)*10;fx=mw-10;ax=mw-20;

   else{const n=3+(R()*3|0);for(let k=0;k<n;k++){setT(x+k,9,2);dot(x+k,8)}ghost(x);if(R()<.6)ghost(x+n+1);x+=n+3}

function phys(e){let l,r,tp,b;const ub=()=>{l=Math.floor(e.x/T);r=Math.floor((e.x+e.w-1)/T);tp=Math.floor(e.y/T);b=Math.floor((e.y+e.h-1)/T)};
