<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pac-Man Bros 1-1</title>
<style>
:root{--bg:#f1efe8;--fg:#1d1b2e;--btn:#1d1b2e;--btnfg:#ffe600;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d1f;--fg:#e8e8f5;--btn:#ffe600;--btnfg:#0d0d1f}}
:root[data-theme="dark"]{--bg:#0d0d1f;--fg:#e8e8f5;--btn:#ffe600;--btnfg:#0d0d1f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px}
canvas{width:100%;max-width:640px;height:auto;image-rendering:pixelated;border:4px solid var(--fg);border-radius:4px;touch-action:none;background:#5c94fc}
p{margin:0;font-size:14px;text-align:center;max-width:640px}
.pad{display:flex;gap:10px;width:100%;max-width:640px;justify-content:space-between}
.pad button{flex:1;padding:16px 0;font:700 18px ui-monospace,Menlo,monospace;background:var(--btn);color:var(--btnfg);border:0;border-radius:10px;touch-action:none;user-select:none}
.pad button:active{filter:brightness(.8)}
</style>
</head>
<body>
<canvas id="c" width="640" height="448"></canvas>
<div class="pad">
  <button id="bl">◀</button><button id="br">▶</button><button id="bj">SALTO</button><button id="bc">DISFRAZ</button>
</div>
<p>Flechas o A/D para moverte, espacio o ↑ para saltar, Shift para correr. Pisa a los fantasmas o come una píldora grande. N / B: nivel. C o 1-7: disfraz.</p>
<script>
const T=32,H=14,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const GROUND=12*T;
let map,q,dots,items,ghosts,pops,bumps,pl,cam,score,lives,power,state,t,lv=0,theme=0,W=118,FLAG=108,cos=0,cosT=0;
const keys={};
const set=(x,y,v)=>{if(x>=0&&x<W&&y>=0&&y<H)map[y][x]=v};
const solid=(x,y)=>x<0||x>=W?true:y<0||y>=H?false:map[y][x]!==0;

function init(full){
  W=lv?90+(lv>>2)*8+(lv%4)*6:118;FLAG=W-10;theme=lv%4;map=Array.from({length:H},()=>Array(W).fill(0));
  q={};dots=[];items=[];ghosts=[];pops=[];bumps={};if(lv>0){gen()}else{
  const gaps=[[58,59],[78,80],[88,89]];
  for(let x=0;x<W;x++){if(gaps.some(g=>x>=g[0]&&x<=g[1]))continue;set(x,12,1);set(x,13,1)}
  const blk=(x,y,v,c)=>{set(x,y,v);if(c)q[x+','+y]=c};
  blk(16,8,3,'d');blk(20,8,2);blk(21,8,3,'d');blk(22,8,2);blk(23,8,3,'p');blk(24,8,2);
  blk(64,8,2);blk(65,8,3,'d');blk(66,8,2);
  for(let x=76;x<=81;x++)blk(x,8,x==78?3:2,x==78?'d':0);
  blk(90,8,3,'d');blk(91,8,3,'p');
  [[28,2],[36,3],[44,4],[50,3]].forEach(([x,h])=>{for(let i=0;i<h;i++){set(x,11-i,6);set(x+1,11-i,6)}set(x,12-h,4);set(x+1,12-h,4)});
  for(let i=0;i<8;i++)for(let j=0;j<=i;j++)set(95+i,11-j,5);
  const line=(a,b,y)=>{for(let x=a;x<=b;x++)dots.push({x:x*T+16,y:y*T+16,got:0})};
  line(5,13,11);line(17,19,11);line(20,24,7);line(26,27,11);line(30,35,11);line(44,45,7);line(46,49,11);line(50,51,7);
  line(54,56,11);line(61,63,11);line(76,81,7);line(84,87,11);line(91,93,11);
  [[57,10],[58,9],[59,9],[60,10],[77,10],[79,5],[81,10],[87,9],[88,8],[89,8],[90,9]].forEach(([x,y])=>dots.push({x:x*T+16,y:y*T+16,got:0}));
  const cols=['#ff2a2a','#ffb8ff','#00e5ff','#ffb852'];
  [14,26,33,47,55,67,74,84,92].forEach((x,i)=>ghosts.push({x:x*T,y:300,w:28,h:28,vx:-.8,vy:0,col:cols[i%4],k:'gpgkpgkgb'[i],dead:0,gone:0,sh:0}));
  }
  pl={x:3*T,y:GROUND-28,w:28,h:28,vx:0,vy:0,face:1,ground:false,m:0,dying:0};
  cam=0;power=0;
  if(full){score=0;lives=3;state='title'}
  t=0;
}

function gen(){
  let sd=lv*7919+13;const R=()=>(sd=(sd*1664525+1013904223)>>>0)/4294967296;
  const w=lv>>2,sx=FLAG-13,pit=new Set(),blk=(x,y,v)=>{set(x,y,v);if(v===3)q[x+','+y]=R()<.25?'p':'d'};
  const cols=['#ff2a2a','#ffb8ff','#00e5ff','#ffb852'],dot=(x,y)=>dots.push({x:x*T+16,y:y*T+16,got:0});
  const mk=x=>ghosts.push({x:x*T,y:300,w:28,h:28,vx:-(.8+w*.1),vy:0,col:cols[Math.floor(R()*4)],k:(()=>{const z=R();return z<.35?'g':z<.55?'p':z<.8?(w>0?'k':'g'):(w>1?'b':'p')})(),dead:0,gone:0,sh:0});
  let x=10;
  while(x<sx-6){
    const r=R(),dens=.55+w*.05;
    if(r<.3){const g=2+Math.floor(R()*(2+(w>3)));for(let i=0;i<g;i++){pit.add(x+i);dot(x+i,i%(g-1)?8:9)}x+=g+3}
    else if(r<.5){const h=2+Math.floor(R()*3);for(let i=0;i<h;i++){set(x,11-i,6);set(x+1,11-i,6)}set(x,12-h,4);set(x+1,12-h,4);dot(x,11-h);dot(x+1,11-h);x+=4;if(R()<dens)mk(x);x+=1}
    else if(r<.75){const n=3+Math.floor(R()*4);for(let i=0;i<n;i++){blk(x+i,8,R()<.35?3:2);dot(x+i,7)}x+=n+1;if(R()<dens)mk(x);x+=2}
    else{if(R()<dens)mk(x+1);if(w>2&&R()<.4)mk(x+3);x+=5}
  }
  for(let i=0;i<W;i++)if(!pit.has(i)){set(i,12,1);set(i,13,1)}
  if(theme%2)for(let i=0;i<W;i++){set(i,0,2);set(i,1,2)}
  for(let i=4;i<sx;i++)if(!pit.has(i)&&!solid(i,11)&&R()<.4)dot(i,11);
  for(let i=0;i<8;i++)for(let j=0;j<=i;j++)set(sx+i,11-j,5);
}

function collide(e){
  let l,r,tp,b;
  const box=()=>{l=Math.floor(e.x/T);r=Math.floor((e.x+e.w-1)/T);tp=Math.floor(e.y/T);b=Math.floor((e.y+e.h-1)/T)};
  e.x+=e.vx;box();e.hitX=false;
  for(let y=tp;y<=b;y++){
    if(e.vx>0&&solid(r,y)){e.x=r*T-e.w;e.hitX=true;break}
    if(e.vx<0&&solid(l,y)){e.x=(l+1)*T;e.hitX=true;break}
  }
  e.y+=e.vy;e.ground=false;e.bump=null;box();
  const cx=Math.floor((e.x+e.w/2)/T),order=[cx,l,r];
  if(e.vy>0){for(const x of order)if(solid(x,b)){e.y=b*T-e.h;e.vy=0;e.ground=true;break}}
  else if(e.vy<0){for(const x of order)if(solid(x,tp)){e.y=(tp+1)*T;e.vy=0;e.bump=[x,tp];break}}
}

function pop(x,y,s){pops.push({x,y,s,t:40})}
function bump(x,y){
  const k=x+','+y;bumps[k]=10;
  if(map[y][x]===3){
    map[y][x]=7;
    if(q[k]==='p')items.push({x:x*T+4,y:y*T-28,w:24,h:24,got:0});
    else{score+=100;pop(x*T,y*T-8,'+100')}
  }
}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function die(){if(pl.dying)return;pl.dying=1;pl.vy=0;pl.vx=0}

function update(){
  t++;
  if(state==='title'||state==='over'||state==='win'){
    if(keys.jump&&t>20){const s=state,sc=score,lf=lives;if(s==='win')lv=(lv+1)%32;init(true);if(s==='win'){score=sc;lives=lf}state='play';keys.jump=false}
    return;
  }
  if(pl.dying){
    pl.dying++;
    if(pl.dying>90){lives--;if(lives<=0)state='over';else{const s=score;init(false);score=s;state='play'}}
    return;
  }
  const run=keys.run?1.5:1,max=3*run;
  if(keys.left){pl.vx-=.35;pl.face=-1}else if(keys.right){pl.vx+=.35;pl.face=1}else pl.vx*=.8;
  pl.vx=Math.max(-max,Math.min(max,pl.vx));
  if(Math.abs(pl.vx)<.05)pl.vx=0;
  if(keys.jump&&pl.ground){pl.vy=-12;pl.ground=false;keys.jump=false;keys.held=true}
  if(!keys.held&&pl.vy<-4)pl.vy*=.5;
  if(!keys.jumpDown)keys.held=false;
  pl.vy=Math.min(pl.vy+.5,12);
  collide(pl);
  if(pl.x<0)pl.x=0;
  if(pl.bump)bump(...pl.bump);
  pl.m+=Math.abs(pl.vx)>.2?.25:.05;
  if(pl.y>(theme==3?GROUND+10:H*T+40))die();
  if(power>0)power--;
  cam=Math.max(0,Math.min(W*T-cv.width,pl.x-240));
  for(const d of dots)if(!d.got&&Math.abs(d.x-pl.x-14)<18&&Math.abs(d.y-pl.y-14)<18){d.got=1;score+=10}
  for(const i of items)if(!i.got&&hit(pl,i)){i.got=1;power=420;score+=50;pop(i.x,i.y,'+50')}
  for(const g of ghosts){
    if(g.gone)continue;
    if(g.dead){if(--g.dead<=0)g.gone=1;continue}
    if(Math.abs(g.x-cam-320)>520)continue;
    if(g.kick>0)g.kick--;if(g.k==='b'){const beh=pl.face*(g.x-pl.x)<0;g.shy=!beh;if(beh){g.x+=Math.sign(pl.x-g.x)*1.1;g.y+=Math.sign(pl.y-g.y)*.8}g.vx=pl.x<g.x?-1:1}else{if(g.sh===1)g.vx=0;g.vy=Math.min(g.vy+.5,12);collide(g);if(g.sh===2){for(const o of ghosts)if(o!==g&&!o.gone&&!o.dead&&hit(g,o)){o.dead=20;score+=200;pop(o.x,o.y,'+200')}}}
    if(g.hitX)g.vx=-g.vx;
    if(g.y>H*T+40){g.gone=1;continue}
    if(hit(pl,g)){
      if(power>0){g.dead=20;score+=200;pop(g.x,g.y,'+200')}
      else if(g.k!=='b'&&pl.vy>0&&pl.y+pl.h-g.y<18){pl.vy=-7;score+=100;pop(g.x,g.y,'+100');if(g.sh===1){g.sh=2;g.vx=pl.x<g.x?6:-6;g.kick=20}else if(g.sh===2){g.sh=1;g.vx=0}else if(g.k==='k'){g.sh=1;g.vx=0;g.y+=10;g.h=18}else g.dead=30}
      else if(g.sh===1||g.kick>0){if(g.sh===1&&!(g.kick>0)){g.sh=2;g.vx=pl.x<g.x?6:-6;g.kick=20}}
      else die();
    }
  }
  for(const k in bumps)if(--bumps[k]<=0)delete bumps[k];
  for(const p of pops){p.y-=1;p.t--}
  pops=pops.filter(p=>p.t>0);
  if(pl.x+pl.w>=FLAG*T+8){state='win';score+=1000;t=0}
}

function cloud(x,y){ctx.fillStyle='#fff';[[0,0,18],[22,-8,22],[48,0,18],[24,6,18]].forEach(([a,b,r])=>{ctx.beginPath();ctx.arc(x+a,y+b,r,0,7);ctx.fill()})}
function hill(x,w,h){ctx.fillStyle='#00a800';ctx.beginPath();ctx.ellipse(x,GROUND,w,h,0,Math.PI,0);ctx.fill();ctx.fillStyle='#005c00';[[-.35,.5],[.2,.4]].forEach(([a,b])=>{ctx.fillRect(x+a*w-3,GROUND-h*b-8,6,12)})}
function bush(x){ctx.fillStyle='#38d838';[0,24,48].forEach((a,i)=>{ctx.beginPath();ctx.arc(x+a,GROUND-(i==1?12:6),i==1?18:13,Math.PI,0);ctx.fill()});ctx.fillRect(x-13,GROUND-6,74,6)}

function tile(v,x,y){
  if(v===1){ctx.fillStyle=['#c84c0c','#2038ec','#c84c0c','#6b6b6b'][theme];ctx.fillRect(x,y,T,T);ctx.fillStyle='#fcbcb0';ctx.fillRect(x,y,T,2);ctx.fillStyle='#000';ctx.fillRect(x+T-2,y,2,T);ctx.fillRect(x,y+T/2,T,2)}
  else if(v===2){ctx.fillStyle=['#b5481c','#3c5cff','#b5481c','#555'][theme];ctx.fillRect(x,y,T,T);ctx.fillStyle='#000';ctx.fillRect(x,y+15,T,2);ctx.fillRect(x,y+T-2,T,2);ctx.fillRect(x+15,y,2,15);ctx.fillRect(x+7,y+17,2,15);ctx.fillRect(x+23,y+17,2,15)}
  else if(v===3){ctx.fillStyle='#f8b800';ctx.fillRect(x,y,T,T);ctx.strokeStyle='#8a4a00';ctx.lineWidth=2;ctx.strokeRect(x+1,y+1,T-2,T-2);ctx.fillStyle='#8a4a00';ctx.font='bold 22px monospace';ctx.textAlign='center';ctx.fillText('?',x+16,y+24)}
  else if(v===7){ctx.fillStyle='#8a6a3a';ctx.fillRect(x,y,T,T);ctx.strokeStyle='#4a3820';ctx.lineWidth=2;ctx.strokeRect(x+1,y+1,T-2,T-2)}
  else if(v===4||v===6){ctx.fillStyle='#00a800';ctx.fillRect(x,y,T,T);ctx.fillStyle='#80ff80';ctx.fillRect(x+4,y,5,T);ctx.fillStyle='#005c00';ctx.fillRect(x+T-5,y,5,T);if(v===4){ctx.fillStyle='#000';ctx.fillRect(x,y,T,2)}}
  else if(v===5){ctx.fillStyle='#d8a870';ctx.fillRect(x,y,T,T);ctx.fillStyle='#fff3d0';ctx.fillRect(x,y,T,3);ctx.fillRect(x,y,3,T);ctx.fillStyle='#5a3a10';ctx.fillRect(x+T-3,y,3,T);ctx.fillRect(x,y+T-3,T,3)}
}

function ghost(g,scared,flash){
  const x=g.x,y=g.y,sq=g.dead&&!scared;if(!scared&&g.k!=='p')return fusion(g);
  if(sq){ctx.fillStyle=g.col;ctx.fillRect(x,y+20,28,8);return}
  ctx.fillStyle=scared?(flash?'#fff':'#2121ff'):g.col;
  ctx.beginPath();ctx.arc(x+14,y+14,14,Math.PI,0);ctx.lineTo(x+28,y+28);
  for(let i=0;i<4;i++){ctx.lineTo(x+28-i*7-3.5,y+23+(((t>>3)+i)%2)*3);ctx.lineTo(x+28-(i+1)*7,y+28)}
  ctx.fill();
  ctx.fillStyle=scared?'#ffb8ae':'#fff';
  if(scared){ctx.fillRect(x+8,y+10,4,4);ctx.fillRect(x+17,y+10,4,4)}
  else{ctx.beginPath();ctx.arc(x+9,y+12,5,0,7);ctx.arc(x+20,y+12,5,0,7);ctx.fill();ctx.fillStyle='#1a1aff';ctx.beginPath();ctx.arc(x+9+(g.vx<0?-2:2),y+13,2.5,0,7);ctx.arc(x+20+(g.vx<0?-2:2),y+13,2.5,0,7);ctx.fill()}
}

const COS=['Mario','Luigi','Mago','Corona','Pirata','Sombrero','Sin gorro'];
function gb(x,y,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x+14,y+14,14,Math.PI,0);ctx.lineTo(x+28,y+28);for(let i=0;i<4;i++){ctx.lineTo(x+28-i*7-3.5,y+23+(((t>>3)+i)%2)*3);ctx.lineTo(x+28-(i+1)*7,y+28)}ctx.fill()}
function dot2(a,b,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(a,b,r,0,7);ctx.fill()}
function fusion(g){
  const x=g.x,y=g.y,k=g.k,d=g.vx<0?-1:1;
  if(k==='k'&&g.sh){ctx.fillStyle='#fff3c0';ctx.fillRect(x,y+12,28,6);ctx.fillStyle='#1fa22e';ctx.beginPath();ctx.arc(x+14,y+12,14,Math.PI,0);ctx.fill();ctx.fillStyle='#0b6b18';ctx.fillRect(x+13,y,2,12);ctx.fillRect(x+4,y+6,20,2);return}
  if(g.dead){ctx.fillStyle=k==='g'?'#8a4b20':'#fff';ctx.fillRect(x,y+20,28,8);return}
  if(k==='g'){gb(x,y,'#f2c99a');ctx.fillStyle='#8a4b20';ctx.beginPath();ctx.arc(x+14,y+13,14,Math.PI,0);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(x+4,y+10,8,6);ctx.fillRect(x+16,y+10,8,6);dot2(x+9+d*2,y+13,2,'#000');dot2(x+19+d*2,y+13,2,'#000');ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+3,y+6);ctx.lineTo(x+12,y+10);ctx.moveTo(x+25,y+6);ctx.lineTo(x+16,y+10);ctx.stroke();ctx.fillStyle='#fff';ctx.fillRect(x+9,y+20,3,4);ctx.fillRect(x+16,y+20,3,4)}
  else if(k==='k'){gb(x,y,'#fff3c0');ctx.fillStyle='#1fa22e';ctx.beginPath();ctx.ellipse(x+14-d*8,y+14,9,10,0,0,7);ctx.fill();ctx.fillStyle='#0b6b18';ctx.fillRect(x+13-d*8,y+5,2,18);dot2(x+14+d*5,y+11,4,'#fff');dot2(x+14+d*7,y+11,2,'#000');ctx.fillStyle='#e8a000';ctx.fillRect(x+14+d*5,y+19,7,3)}
  else{ctx.globalAlpha=.9;gb(x,y,'#f4f4ff');ctx.globalAlpha=1;if(g.shy){dot2(x+8,y+12,6,'#f4f4ff');dot2(x+20,y+12,6,'#f4f4ff');ctx.strokeStyle='#8888aa';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x+8,y+12,6,0,7);ctx.moveTo(x+26,y+12);ctx.arc(x+20,y+12,6,0,7);ctx.stroke()}else{dot2(x+9,y+11,3,'#000');dot2(x+19,y+11,3,'#000');ctx.fillStyle='#600';ctx.beginPath();ctx.ellipse(x+14,y+20,7,5,0,0,7);ctx.fill();dot2(x+14,y+23,3,'#ff7a9a')}}
}
function hat(){
  const c=cos;ctx.save();
  if(c<2){const col=c?'#10a020':'#e52521';ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,-8,15,Math.PI,0);ctx.fill();ctx.fillRect(2,-10,16,3.5);dot2(0,-17,5,'#fff');ctx.fillStyle=col;ctx.font='bold 8px sans-serif';ctx.textAlign='center';ctx.save();if(pl.face<0)ctx.scale(-1,1);ctx.fillText(c?'L':'M',0,-14.5);ctx.restore()}
  else if(c===2){ctx.fillStyle='#5b2bbd';ctx.beginPath();ctx.moveTo(-12,-9);ctx.lineTo(12,-9);ctx.lineTo(3,-36);ctx.fill();ctx.beginPath();ctx.ellipse(0,-9,17,4,0,0,7);ctx.fill();ctx.fillStyle='#ffd700';ctx.fillRect(-11,-14,22,3);dot2(0,-22,2.5,'#ffd700')}
  else if(c===3){ctx.fillStyle='#ffcc00';ctx.beginPath();ctx.moveTo(-11,-10);ctx.lineTo(-11,-25);ctx.lineTo(-5.5,-17);ctx.lineTo(0,-27);ctx.lineTo(5.5,-17);ctx.lineTo(11,-25);ctx.lineTo(11,-10);ctx.fill();dot2(0,-14,2.5,'#e52521');dot2(-6,-13,1.5,'#2a6bff');dot2(6,-13,1.5,'#2a6bff')}
  else if(c===4){ctx.fillStyle='#111';ctx.beginPath();ctx.arc(0,-8,13,Math.PI,0);ctx.fill();ctx.beginPath();ctx.moveTo(-20,-8);ctx.lineTo(-12,-17);ctx.lineTo(12,-17);ctx.lineTo(20,-8);ctx.fill();dot2(0,-13,3.5,'#fff');ctx.fillStyle='#111';ctx.fillRect(-2,-13,1.5,1.5);ctx.fillRect(1,-13,1.5,1.5)}
  else if(c===5){ctx.fillStyle='#e8b04a';ctx.beginPath();ctx.ellipse(0,-9,23,5,0,0,7);ctx.fill();ctx.beginPath();ctx.arc(0,-9,10,Math.PI,0);ctx.fill();ctx.fillStyle='#d62828';ctx.fillRect(-10,-12,20,3)}
  ctx.restore();
}
function tex(v,x,y,tx,ty){
  const h=i=>((tx*73+ty*151+i*31)*2654435761>>>0)%100/100;
  if(v===1){if(ty===12){ctx.fillStyle=theme%2?'#9a9a9a':'#34c71f';ctx.fillRect(x,y,T,6);ctx.fillStyle=theme%2?'#777':'#1c8a10';for(let i=0;i<4;i++)ctx.fillRect(x+i*8+h(i)*4,y+6,3,3+h(i+5)*3)}
    for(let i=0;i<5;i++){ctx.fillStyle=h(i+9)>.5?'rgba(0,0,0,.25)':'rgba(255,255,255,.2)';ctx.fillRect(x+h(i)*26,y+10+h(i+3)*18,3,3)}}
  else if(v===2||v===5){ctx.fillStyle='rgba(255,255,255,.18)';ctx.fillRect(x+2,y+2,T-4,2);for(let i=0;i<3;i++){ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(x+h(i)*24+2,y+4+h(i+4)*22,3,2)}}
  else if(v===3){ctx.fillStyle='#fff6a0';[[3,3],[T-6,3],[3,T-6],[T-6,T-6]].forEach(p=>ctx.fillRect(x+p[0],y+p[1],3,3));ctx.fillStyle='rgba(255,255,255,'+(.25+.2*Math.sin(t/10+tx))+')';ctx.fillRect(x+4,y+4,8,3)}
  else if(v===4||v===6){ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(x+12,y,3,T);if(v===4){ctx.fillStyle='#00c800';ctx.fillRect(x,y+2,T,8);ctx.fillStyle='#000';ctx.fillRect(x,y+10,T,2)}}
}
function pac(){
  const cx=pl.x+14,cy=pl.y+14;
  ctx.save();ctx.translate(cx,cy);if(pl.face<0)ctx.scale(-1,1);
  ctx.fillStyle='#ffe600';ctx.beginPath();
  if(pl.dying){
    const a=Math.min(Math.PI,(pl.dying/60)*Math.PI);
    if(a<Math.PI){ctx.moveTo(0,0);ctx.arc(0,0,15,-Math.PI/2+a,-Math.PI/2-a+Math.PI*2)}
  }else{
    const m=.05+Math.abs(Math.sin(pl.m))*.35*(pl.ground?1:.7);
    ctx.moveTo(0,0);ctx.arc(0,0,15,m,Math.PI*2-m);
  }
  ctx.closePath();ctx.fill();
  if(!pl.dying){ctx.fillStyle='#000';ctx.beginPath();ctx.arc(5,-3,2.2,0,7);ctx.fill();hat()}
  ctx.restore();
}

function draw(){
  const gr=ctx.createLinearGradient(0,0,0,448),sk=[['#2f6fe0','#9fd0ff'],['#000','#0a0a1a'],['#0c0c40','#3a2a7a'],['#1a0404','#5a1408']][theme];gr.addColorStop(0,sk[0]);gr.addColorStop(1,sk[1]);ctx.fillStyle=gr;ctx.fillRect(0,0,640,448);if(theme==2){ctx.fillStyle='#fff';for(let i=0;i<50;i++)ctx.fillRect(((i*97-cam*.2)%640+640)%640,(i*53)%250,2,2)}
  ctx.save();ctx.translate(-Math.floor(cam),0);
  if(theme%2==0)for(let c=0;c<W*2;c+=7)cloud(c*T/2+40,60+(c%3)*30);if(theme==3){ctx.fillStyle='#ff5a00';ctx.fillRect(cam,12*T+16,640,200)}
  if(theme==0)for(let c=3;c<W;c+=14)hill(c*T,80+(c%3)*20,60+(c%2)*30);
  if(theme==0)for(let c=11;c<W;c+=15)bush(c*T);
  // castle + flag
  ctx.fillStyle='#b5481c';ctx.fillRect((FLAG+4)*T,GROUND-96,128,96);ctx.fillStyle='#000';ctx.fillRect((FLAG+4)*T+48,GROUND-48,32,48);
  ctx.fillStyle='#b5481c';for(let i=0;i<4;i++)ctx.fillRect((FLAG+4)*T+i*34,GROUND-112,22,16);
  ctx.fillStyle='#d0d0d0';ctx.fillRect(FLAG*T+14,3*T,4,GROUND-3*T);ctx.fillStyle='#ffe600';ctx.beginPath();ctx.arc(FLAG*T+16,3*T-4,6,0,7);ctx.fill();
  ctx.fillStyle='#00c800';ctx.beginPath();ctx.moveTo(FLAG*T+14,3*T+4);ctx.lineTo(FLAG*T-14,3*T+20);ctx.lineTo(FLAG*T+14,3*T+36);ctx.fill();
  const x0=Math.floor(cam/T),x1=x0+21;
  for(let y=0;y<H;y++)for(let x=x0;x<=x1&&x<W;x++){const v=map[y][x];if(v){const b=bumps[x+','+y]||0;{const yy=y*T-(b>0?Math.sin(b/10*Math.PI)*8:0);tile(v,x*T,yy);tex(v,x*T,yy,x,y)}}}
  for(const d of dots)if(!d.got&&d.x>cam-10&&d.x<cam+650){ctx.fillStyle='#ffd9a8';ctx.beginPath();ctx.arc(d.x,d.y,4,0,7);ctx.fill()}
  for(const i of items)if(!i.got){ctx.fillStyle='#ffd9a8';ctx.beginPath();ctx.arc(i.x+12,i.y+12,8+Math.sin(t/6)*2,0,7);ctx.fill()}
  for(const g of ghosts){if(g.gone)continue;ghost(g,power>0&&!g.dead,power<120&&(t>>3)%2)}
  pac();
  ctx.font='bold 14px monospace';ctx.textAlign='left';ctx.fillStyle='#fff';
  for(const p of pops)ctx.fillText(p.s,p.x,p.y);
  ctx.restore();
  // HUD
  ctx.fillStyle='#fff';ctx.font='bold 16px ui-monospace,Menlo,monospace';ctx.textAlign='left';
  ctx.fillText('PACMAN '+String(score).padStart(6,'0'),16,26);
  ctx.fillText('VIDAS x'+Math.max(lives,0),270,26);ctx.textAlign='right';ctx.fillText('MUNDO '+((lv>>2)+1)+'-'+(lv%4+1),624,26);
  if(power>0){ctx.fillStyle='#ffe600';ctx.fillRect(16,34,power/420*120,5)}
  if(cosT>0){cosT--;ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText('Disfraz: '+COS[cos],320,70)}
  if(state!=='play'){
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,150,640,150);ctx.textAlign='center';ctx.fillStyle='#ffe600';ctx.font='bold 34px ui-monospace,Menlo,monospace';
    const m={title:['PAC-MAN BROS','Pulsa ESPACIO o toca SALTO'],over:['GAME OVER','Pulsa ESPACIO para reintentar'],win:['¡NIVEL COMPLETADO!','Puntos: '+score+' · ESPACIO: siguiente nivel']}[state];
    ctx.fillText(m[0],320,210);ctx.fillStyle='#fff';ctx.font='16px ui-monospace,Menlo,monospace';ctx.fillText(m[1],320,250);
  }
}

// entrada
const K={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ShiftLeft:'run',ShiftRight:'run',ArrowUp:'jump',KeyW:'jump',Space:'jump'};
addEventListener('keydown',e=>{if(e.code==='KeyC'||/^Digit[1-7]$/.test(e.code)){cos=e.code==='KeyC'?(cos+1)%7:+e.code[5]-1;cosT=120;return}if(e.code==='KeyN'||e.code==='KeyB'){lv=(lv+(e.code==='KeyN'?1:31))%32;init(false);state='play';return}const k=K[e.code];if(!k)return;e.preventDefault();if(k==='jump'){if(!keys.jumpDown)keys.jump=true;keys.jumpDown=true}else keys[k]=true});
addEventListener('keyup',e=>{const k=K[e.code];if(!k)return;if(k==='jump'){keys.jumpDown=false;keys.jump=false}else keys[k]=false});
const bind=(id,k)=>{const b=document.getElementById(id);
  b.addEventListener('pointerdown',e=>{e.preventDefault();if(k==='jump'){keys.jump=true;keys.jumpDown=true}else keys[k]=true});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{if(k==='jump'){keys.jump=false;keys.jumpDown=false}else keys[k]=false}))};
bind('bl','left');bind('br','right');bind('bj','jump');
document.getElementById('bc').addEventListener('click',()=>{cos=(cos+1)%7;cosT=120});
cv.addEventListener('pointerdown',()=>{if(state!=='play')keys.jump=true});

init(true);
let last=performance.now(),acc=0;
(function loop(now){acc+=Math.min(now-last,100);last=now;while(acc>=1000/60){update();acc-=1000/60}draw();requestAnimationFrame(loop)})(last);
</script>
